<style>
:root{--bg:#0b0f19;--card:#141a29;--line:#222b40;--txt:#e6ebf5;--mute:#8b97b3;--gold:#f5b83d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + var(--sc-anchor,0px)) env(safe-area-inset-left)}
.wrap{max-width:860px;margin:0 auto;padding:12px clamp(12px,3vw,28px) 40px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#f5b83d,#ef8f3d);color:#1a1205;font-weight:800;text-decoration:none;font-size:15px;box-shadow:0 6px 16px rgba(245,184,61,.25)}
.top h1{margin:0;font-size:clamp(18px,3.4vw,28px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.games button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:13.5px;font-weight:700;line-height:1.3}
.games button.on{border-color:var(--gold);background:#231d10;box-shadow:inset 0 0 0 1px var(--gold)}
.ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff}
.ico.t{font-family:"Kaiti TC","STKaiti","DFKai-SB","BiauKai",serif;background:#fdf3dc!important;color:#b91c1c;border:3px solid #b91c1c}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button,.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0f1420;color:#cfd8ea;font-size:13.5px;cursor:pointer}
.chips button.on,.seg button.on{background:var(--gold);color:#1a1205;border-color:var(--gold);font-weight:800}
.seg{display:flex;gap:4px}
.desc{color:var(--mute);font-size:13px;margin:0 0 10px}
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.hd{background:#0f1420;color:var(--mute);font-size:12.5px;padding:10px 16px}
.rk{font:800 16px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);text-align:center}
.r1 .rk{color:#f1c40f;font-size:22px}.r2 .rk{color:#cfd6df;font-size:20px}.r3 .rk{color:#d68a4a;font-size:19px}
.r1{background:rgba(241,196,15,.07)}.r2{background:rgba(189,195,199,.05)}.r3{background:rgba(205,127,50,.06)}
.nm{min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.nm small{color:var(--mute);font-size:12px}
.sc{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row.me{box-shadow:inset 3px 0 0 #35e08a}
.empty{padding:40px 16px;text-align:center;color:var(--mute);line-height:1.7}
.empty a{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:999px;background:var(--gold);color:#1a1205;font-weight:800;text-decoration:none}
.note{color:var(--mute);font-size:12.5px;line-height:1.7;margin-top:14px}
@media(max-width:560px){.games{grid-template-columns:repeat(3,1fr)}.games button{font-size:12px;padding:10px 4px}.ico{width:34px;height:34px;font-size:19px}.row{grid-template-columns:42px 1fr auto;padding:11px 12px}.home{padding:9px 14px;font-size:14px}}
</style>

  }
  function big(v) { var a = Math.abs(v), s = v < 0 ? '-' : ''; if (SC.lang === 'en') return s + (a >= 1e12 ? (a / 1e12).toFixed(2) + 'T' : a >= 1e9 ? (a / 1e9).toFixed(2) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : Math.round(a).toLocaleString('en')); return s + (a >= 1e12 ? (a / 1e12).toFixed(2) + ' 兆' : a >= 1e8 ? (a / 1e8).toFixed(2) + ' 億' : a >= 1e4 ? (a / 1e4).toFixed(1) + ' 萬' : Math.round(a).toLocaleString('zh-TW')); }
  function fmt(v) { var u = CFG[st.game].unit; if (u === 'money') return money(v); if (u === 'pt') return Math.round(v).toLocaleString(SC.lang === 'en' ? 'en' : 'zh-TW') + SC.t(' 分', ' pts'); if (u === 'usd') return '$' + Math.round(v).toLocaleString('en'); if (u === 'm') return Math.round(v).toLocaleString('en') + ' m'; if (u === 'n') return Math.round(v).toLocaleString('en') + SC.t(CFG[st.game].sfx[0], CFG[st.game].sfx[1]); if (u === 'coin') return '🪙 ' + big(v); if (u === 'lv') return Math.round(v) + SC.t(' 關', ' levels'); if (u === 'cnt') return Math.round(v) + SC.t(' 題', ' solved'); var m = Math.floor(v / 60), s = v - m * 60; return m ? m + SC.t(' 分 ', 'm ') + Math.round(s) + SC.t(' 秒', 's') : (Math.round(v * 10) / 10) + SC.t(' 秒', 's'); }
  function gameOf(id) { for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i]; return { zh: id, en: id, icon: '🎮', color: '#333', url: '/' }; }
  function renderTabs() {
    $('games').innerHTML = (window.SC_GAMES || []).map(function (g) { return g.id; }).filter(function (id) { return CFG[id]; }).map(function (id) {
      var g = gameOf(id), tt = g.icon.length === 1 && /[一-鿿]/.test(g.icon);
      return '<button data-g="' + id + '" class="' + (id === st.game ? 'on' : '') + '"><span class="ico' + (tt ? ' t' : '') + '" style="background:' + g.color + (g.fg ? ';color:' + g.fg + ';border-color:' + g.fg : '') + '">' + g.icon + '</span>' + (SC.lang === 'en' ? g.en : g.zh) + '</button>';
    }).join('');
    var c = CFG[st.game];
    if (!c.modes.some(function (m) { return m[0] === st.mode; })) st.mode = st.game === 'trader' ? 'normal' : (st.game === 'bigtwo' || st.game === 'mahjong' || st.game === 'link' || st.game === 'gomoku' || st.game === 'reversi' || st.game === 'connect4' || st.game === 'chess' || st.game === 'cchk' || st.game === 'uttt' || st.game === 'hearts' || st.game === 'pickred' || st.game === 'hockey') ? 'normal' : (st.game === 'mines' || st.game === 'sudoku') ? 'easy' : st.game === 'go' ? '9-normal' : st.game === 'sudoku' ? 'easy' : c.modes[0][0];
    $('modes').innerHTML = c.modes.map(function (m) { return '<button data-m="' + m[0] + '" class="' + (m[0] === st.mode ? 'on' : '') + '">' + SC.t(m[1], m[2]) + '</button>'; }).join('');
    [].forEach.call($('period').children, function (b) { b.classList.toggle('on', b.getAttribute('data-p') === st.period); });
    $('desc').textContent = SC.t(c.d[0], c.d[1]);
  }
  var seq = 0;
  function load() {
    renderTabs();
    if (history.replaceState) history.replaceState(null, '', '?game=' + st.game + '&mode=' + st.mode + (st.period === 'month' ? '&period=month' : '') + (q.get('lang') ? '&lang=' + SC.lang : ''));
    var my = ++seq, g = gameOf(st.game);
    $('board').innerHTML = '<div class="empty">' + SC.t('讀取中…', 'Loading…') + '</div>';
    SCLB.top(st.game, st.mode, st.period, 100).then(function (j) {
      if (my !== seq) return;
      if (!j || !j.ok) throw new Error('bad');
      if (!j.rows.length) { $('board').innerHTML = '<div class="empty">' + SC.t('這個榜還沒有人上榜，快來搶第一！', 'No one is on this board yet. Be the first!') + '<br><a href="' + g.url + '">▶ ' + SC.t('去玩', 'Play') + ' ' + esc(SC.lang === 'en' ? g.en : g.zh) + '</a></div>'; return; }
      $('board').innerHTML = '<div class="row hd"><span style="text-align:center">' + SC.t('名次', 'Rank') + '</span><span>' + SC.t('玩家', 'Player') + '</span><span>' + SC.t('成績', 'Score') + '</span></div>' +
        j.rows.map(function (r, i) {
          return '<div class="row' + (i < 3 ? ' r' + (i + 1) : '') + (me && r.name === me ? ' me' : '') + '"><span class="rk">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</span><span class="nm"><b>' + esc(r.name) + '</b><small>' + esc(r.at) + '</small></span><span class="sc">' + fmt(r.score) + '</span></div>';
        }).join('');
    }).catch(function () { if (my === seq) $('board').innerHTML = '<div class="empty">' + SC.t('排行榜暫時連不上，請稍後再試。', 'The leaderboard is unavailable right now. Please try again later.') + '</div>'; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-g')) { st.game = b.getAttribute('data-g'); st.mode = ''; load(); }
    else if (b.hasAttribute('data-m')) { st.mode = b.getAttribute('data-m'); load(); }
    else if (b.hasAttribute('data-p')) { st.period = b.getAttribute('data-p'); load(); }
  });
  SC.onLang(load);
  load();
})();
</script>
</body>
</html>
