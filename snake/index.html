<body>
<header class="k-top">
  <div class="k-brand"><span class="k-logo">🐍</span><div><h1 data-en="Snake">貪吃蛇</h1><small data-en="Eat, grow, don't crash">吃、變長、別撞到</small></div></div>
  <div class="k-acts">
    <button class="btn ghost" data-lang-toggle>EN</button>
    <button class="btn ghost" id="bSound">🔊</button>
    <a class="btn ghost" href="/leaderboard/?game=snake&mode=classic" style="text-decoration:none">🏆</a>

  </div>
</header>
<main class="wrap">
  <div class="scores"><div class="sc"><span data-en="SCORE">分數</span><b id="score">0</b></div><div class="sc"><span data-en="LENGTH">長度</span><b id="len">3</b></div><div class="sc"><span data-en="BEST">最高</span><b id="best">0</b></div></div>

</main>
<section class="k-help">
  <article><h2 data-en="How to play">玩法</h2><p data-en="Steer the snake to eat fruit. Each fruit makes it longer and a little faster. Hitting the wall or your own body ends the game. Golden fruit appears now and then for a short time — grab it for bonus points.">控制蛇去吃水果，每吃一個就變長、速度也會變快一點。撞到牆壁或自己的身體就結束。偶爾會出現限時的金色水果，吃到可以拿額外分數。</p></article>
  <article><h2 data-en="Scoring">計分</h2><p data-en="Fruit is worth 10 points at the start, rising as the snake speeds up. Golden fruit is worth five times as much.">水果一開始 10 分，速度越快分數越高；金色水果是一般水果的 5 倍。</p></article>
</section>
<footer class="k-foot"><span data-en="Free to play. Scores you choose to submit appear on the global leaderboard.">免費遊玩；選擇上傳的成績會顯示在全球排行榜。</span>　<a href="privacy.html" data-en="Privacy policy">隱私權政策與廣告說明</a></footer>
<div class="k-ov" id="ovStart" data-sticky><div class="k-modal center"><div class="k-big">🐍</div><h2 data-en="Snake">貪吃蛇</h2><p class="mute" id="bestLine"></p><div class="k-row"><button class="btn big" id="bStart" data-en="Start">開始</button></div></div></div>
