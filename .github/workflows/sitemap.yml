# 遊戲清單（shared/games.js）或任一頁面變動時，自動重新產生 sitemap.xml 並提交
name: Update sitemap
on:
  push:
    branches: [main]
    paths:
      - 'shared/games.js'
      - '**/index.html'
      - '**/privacy.html'
      - 'tools/build-sitemap.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-sitemap.js
      - name: Commit if changed
        run: |
          if git diff --quiet sitemap.xml; then echo "sitemap unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "自動更新 sitemap.xml"
          git push
