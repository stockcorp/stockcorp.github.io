<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="Tap two or more touching blocks of the same colour to pop them. Blocks above fall down and empty columns slide left. Popping n blocks scores n × n × 5, so build big groups first. The level ends when nothing can be popped; leaving fewer than 10 blocks earns a bonus.">點一下兩個以上相連的同色方塊就會一起消失，上面的方塊往下掉、空掉的直行會往左靠。一次消 n 個得 n × n × 5 分，所以盡量湊大塊再消。沒有可以消的方塊時這一關結束，剩下不到 10 個有額外獎勵。</p></article><article><h2 data-en="Levels">過關</h2><p data-en="Reach the target score when a level ends to move on — the target rises each level. Fall short and the game is over.">關卡結束時總分達到目標分數就進入下一關，目標每關提高；沒達到就遊戲結束。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Your final score can go on the global leaderboard.">遊戲結束時的總分可以上傳全球排行榜。</p></article></section>
