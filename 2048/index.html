<body>
<header class="k-top">
  <div class="k-brand"><span class="k-logo">🔢</span><div><h1>2048</h1><small data-en="Slide · merge · reach 2048">滑動合併，挑戰 2048</small></div></div>
  <div class="k-acts">
    <button class="btn ghost" data-lang-toggle>EN</button>
    <button class="btn ghost" id="bSound">🔊</button>
    <a class="btn ghost" href="/leaderboard/?game=2048&mode=4x4" style="text-decoration:none">🏆</a>
    <button class="btn" id="bNew" data-en="New">新局</button>
  </div>
</header>

<main class="wrap">
  <div class="scores">
    <div class="sc"><span data-en="SCORE">分數</span><b id="score">0</b><i id="plus"></i></div>
    <div class="sc"><span data-en="BEST">最高</span><b id="best">0</b></div>
    <button class="btn ghost undo" id="bUndo">↶ <span data-en="Undo">悔棋</span> (<b id="undoLeft">3</b>)</button>
  </div>
  <div class="board" id="board" aria-label="2048 board">
    <div class="cells" id="cells"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <p class="tip mute" data-en="Swipe on the board, or use arrow keys / WASD.">在棋盤上滑動，或用方向鍵 / WASD 移動。</p>
</main>

<section class="k-help">
  <article><h2 data-en="How to play">玩法</h2>
    <p data-en="Every move slides all tiles in one direction. Two tiles with the same number merge into one with their sum, and you score that sum. After each move a new 2 (sometimes 4) appears. Reach the 2048 tile to win, then keep going for a higher score. The game ends when no move is possible.">每次滑動，所有方塊都會往同一個方向移動；兩個相同數字相撞會合併成兩者的和，並加上同樣的分數。每走一步會隨機出現一個 2（偶爾是 4）。合出 2048 就過關，也可以繼續挑戰更高分；格子滿了又無法合併就結束。</p></article>
  <article><h2 data-en="Tips">小技巧</h2>
    <p data-en="Keep your biggest tile in a corner and build a descending chain along one edge. Avoid the direction that pulls the big tile out of its corner. You get 3 undos per game.">把最大的數字固定在一個角落，沿著一邊由大到小排列；盡量不要往會把大數字拉離角落的方向滑。每局可以悔棋 3 次。</p></article>
</section>
<footer class="k-foot"><span data-en="Free to play. Scores you choose to submit appear on the global leaderboard.">免費遊玩；選擇上傳的成績會顯示在全球排行榜。</span>　<a href="privacy.html" data-en="Privacy policy">隱私權政策與廣告說明</a></footer>
