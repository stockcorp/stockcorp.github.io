<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="Before the start, hold Gas to keep the revs in the green zone, then hit Launch the moment the light turns green — too early is a foul and you lose. After that the throttle is flat out: tap Shift when the needle reaches the green zone; the better your timing, the faster you go. Nitro 🔥 works once per race.">起跑前按住「油門」把轉速維持在綠色區，綠燈一亮就按「起跑」；太早按算偷跑直接輸。起跑後油門自動全開，轉速指針進到綠色區時按「換檔」，越準加速越快。氮氣 🔥 每場只能用一次。</p></article><article><h2 data-en="Upgrades">改裝</h2><p data-en="Winning pays prize money. Spend it in the garage on the engine (power), tyres (launch grip), gearbox (faster shifts) and nitro (longer burn), then take on faster rivals.">贏了對手可以拿獎金，在車庫升級引擎（馬力）、輪胎（起跑抓地）、變速箱（換檔更快）和氮氣（噴更久），再挑戰更強的對手。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="The leaderboard ranks the time from green light to the finish line, reaction included (measured by the server) — lower is better.">比的是從綠燈亮起到衝線的時間（含反應時間，伺服器計時），越短越好。</p></article></section>
