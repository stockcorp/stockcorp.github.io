<body>
<header class="top"><h1>搶救 AI 教父大作戰</h1><span>免費網頁闖關遊戲</span></header>
<div class="stage">
  <canvas id="game" width="960" height="540" aria-label="遊戲畫面"></canvas>
  <div id="touch">
    <div class="pad l"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div>
    <div class="pad r"><button data-key="shoot" aria-label="丟晶片">晶片</button><button data-key="jump" class="big" aria-label="跳躍">跳</button></div>
  </div>
</div>
<main class="info">
  <section>
    <h2>怎麼玩</h2>
    <ul>
      <li><b>電腦</b>：← → 或 A D 移動，空白鍵／↑ 跳躍，X 丟晶片，P 暫停，M 靜音。</li>
      <li><b>手機</b>：建議橫向握持，使用畫面上的按鈕。</li>
      <li>收集<b>算力晶片</b>到商店升級；每關有 3 個<b>股權碎片</b>，收集過半才能奪回執行長。</li>
      <li>碰到綠色旗子會存檔，失誤後從那裡重新出發。進度自動存在你的瀏覽器。</li>
    </ul>
  </section>
  <section>
    <h2>故事</h2>
    <p>雷老大創辦的曜芯科技，在新晶片發表會前夕被神祕財團奪走。穿上工程師連身服、背起風扇背包，從夜市一路闖回總部頂樓，把公司搶回來！</p>
  </section>
</main>
<footer class="foot">
  <p>本遊戲的人物、公司與情節<strong>純屬虛構</strong>，如有雷同純屬巧合，與任何真實人物或企業無關。</p>
  <p><a href="privacy.html">隱私權政策與廣告說明</a></p>
</footer>
