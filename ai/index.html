<body>
<header class="top"><h1 data-en="Save the AI Godfather">搶救 AI 教父大作戰</h1><span data-en="Free browser platformer">免費網頁闖關遊戲</span><button class="lang" data-lang-toggle>EN</button></header>
<div class="stage">
  <canvas id="game" width="960" height="540" aria-label="遊戲畫面"></canvas>
  <div id="touch">
    <div class="pad l"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div>
    <div class="pad r"><button data-key="shoot" aria-label="throw" data-en="Chip">晶片</button><button data-key="jump" class="big" aria-label="jump" data-en="Jump">跳</button></div>
  </div>
</div>
<main class="info">
  <section>
    <h2 data-en="How to play">怎麼玩</h2>
    <ul>
      <li data-en="<b>Computer</b>: ← → or A D to move, Space / ↑ to jump, X to throw chips, P to pause, M to mute."><b>電腦</b>：← → 或 A D 移動，空白鍵／↑ 跳躍，X 丟晶片，P 暫停，M 靜音。</li>
      <li data-en="<b>Phone</b>: hold it sideways and use the on-screen buttons."><b>手機</b>：建議橫向握持，使用畫面上的按鈕。</li>
      <li data-en="Collect <b>compute chips</b> to buy upgrades. Each stage hides 3 <b>share fragments</b>; collect more than half to become CEO again.">收集<b>算力晶片</b>到商店升級；每關有 3 個<b>股權碎片</b>，收集過半才能奪回執行長。</li>
      <li data-en="Touch a green flag to save. If you fall, you restart from there. Progress is saved in your browser.">碰到綠色旗子會存檔，失誤後從那裡重新出發。進度自動存在你的瀏覽器。</li>
    </ul>
  </section>
  <section>
    <h2 data-en="Story">故事</h2>
    <p data-en="Boss Lei founded Yaoxin Tech, but on the eve of a new chip launch a mystery fund takes it from him. In engineer overalls and a fan backpack, he fights from the night market all the way back to the HQ rooftop to take the company back!">雷老大創辦的曜芯科技，在新晶片發表會前夕被神祕財團奪走。穿上工程師連身服、背起風扇背包，從夜市一路闖回總部頂樓，把公司搶回來！</p>
  </section>
</main>
