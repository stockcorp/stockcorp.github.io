<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="The computer picks a four-digit number with four different digits (a leading 0 is allowed). Enter a guess of four different digits and you get “xA yB”: A means right digit in the right place, B means right digit in the wrong place. For 1234, the guess 1325 scores 1A2B. Reach 4A to win.">電腦想好一個四位數，四個數字都不一樣（可以有 0 開頭）。輸入你猜的四個不同數字，電腦會回答「幾 A 幾 B」：A 表示數字和位置都對，B 表示數字對但位置不對。例如答案 1234，猜 1325 會得到 1A2B。猜到 4A 就過關。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Your time from first guess to solving it (measured by the server) can go on the leaderboard — faster is better.">從第一次猜到猜中的時間（伺服器計時）可以上傳排行榜，越快越好。</p></article></section>
