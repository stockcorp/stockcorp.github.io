</main>
<section class="k-help"><article><h2 data-en="Rules">規則</h2><p data-en="✕ goes first. The square you pick inside a small board sends your opponent to the small board in the same position on the big board (it lights up). Win a small board by getting three in a row there; win the game with three small boards in a row. If the board you are sent to is already decided or full, you may play anywhere. If nobody makes a line, whoever won more small boards wins.">✕ 先下。你下在小棋盤裡的哪一格，對手下一步就必須下在大棋盤「同一個位置」的小棋盤（發亮的那一個）。在小棋盤連成一線就贏下那一格；在大棋盤連成一線的人獲勝。如果被指定的小棋盤已經分出勝負或下滿，就可以任選一個。全部下完都沒人連線時，贏得較多小棋盤的人勝。</p></article><article><h2 data-en="Play online">線上對戰</h2><p data-en="Press 🌐 Online for a random match or a room code. Sides swap every game. Online games are not on the leaderboard.">按「🌐 線上對戰」隨機配對或建立房間找朋友，每局交換先後手。線上對局不列入排行榜。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Beat the computer and your time (measured by the server) can go on that level&#39;s leaderboard.">擊敗電腦後，從開局到獲勝的時間（伺服器計時）可以上傳該難度的排行榜。</p></article></section>
<footer class="k-foot"><span data-en="Free to play. Scores you choose to submit appear on the global leaderboard.">免費遊玩；選擇上傳的成績會顯示在全球排行榜。</span>　<a href="privacy.html" data-en="Privacy policy">隱私權政策與廣告說明</a></footer>
