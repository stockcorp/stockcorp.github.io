<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="The numbers beside each row and above each column give the lengths of the runs of filled squares in that line, in order, with at least one blank between runs. “3 1” means three filled in a row, a gap, then one more. Fill in every square that should be filled to win.">每一列左邊、每一行上面的數字，代表那一排「連續塗黑的格子」有幾段、每段多長，段和段之間至少隔一格空白。例如「3 1」表示先有連續 3 格，隔至少一格，再有 1 格。用推理把所有該塗的格子塗黑就過關。</p></article><article><h2 data-en="Controls">操作</h2><p data-en="Tap to fill, tap again to clear. Switch to ✕ mode to mark squares you know are blank. Drag to paint several squares at once. On a computer, right-click marks ✕.">點一下塗黑、再點一下清除。切換成「✕ 打叉」模式可以標記確定是空白的格子。按住拖曳可以一次塗很多格。電腦可以用右鍵打叉。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Each size has its own leaderboard for solving time, measured by the server.">每種大小各有排行榜，比的是解題時間（伺服器計時）。</p></article></section>
