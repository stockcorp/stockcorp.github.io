<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="Move with the arrow keys (or the pad at the bottom left) and fire with Space (or the Fire button). Destroy every enemy tank to clear the stage. If the enemy hits your base 💎 or you lose all your tanks, the game is over. Red enemy tanks take two hits.">用方向鍵（或畫面左下的方向鍵）移動坦克，空白鍵（或「開火」按鈕）發射砲彈。打掉所有敵軍坦克就過關；如果敵人打中下方的基地 💎 或你的坦克全部被擊毀，遊戲結束。紅色的敵軍要打兩下。</p></article><article><h2 data-en="Terrain">地形</h2><p data-en="Red brick walls can be shot through, grey steel cannot, blue water stops tanks but not shells, and green grass hides whatever is inside it.">紅色磚牆可以打穿，灰色鋼牆打不壞，藍色水面坦克過不去但砲彈可以飛過，綠色草叢可以躲在裡面。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Your final score can go on the global leaderboard.">遊戲結束時的總分可以上傳全球排行榜。</p></article></section>
<footer class="k-foot"><span data-en="Free to play. Scores you choose to submit appear on the global leaderboard.">免費遊玩；選擇上傳的成績會顯示在全球排行榜。</span>　<a href="privacy.html" data-en="Privacy policy">隱私權政策與廣告說明</a></footer>
