    var ua = navigator.userAgent || '';

      !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.wacp);
  }
  window.WACP_IS_APP = app;
  if (app) { document.documentElement.className += ' in-app'; return; }

  s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3440199491716602';

})();
