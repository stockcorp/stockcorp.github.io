<body>
<header class="k-top">
  <div class="k-brand"><span class="k-logo">🔢</span><div><h1 data-en="Sliding Puzzle">數字華容道</h1><small id="sub"></small></div></div>
  <div class="k-acts">

<section class="k-help"><article><h2 data-en="How to play">玩法</h2><p data-en="Tap a tile in the same row or column as the gap and it slides in — tap a farther tile to slide several at once. You can also swipe or use the arrow keys. Put the numbers in order with the gap in the bottom-right corner.">點一下空格旁邊（同一列或同一行）的數字，它就會滑進空格；點同一排比較遠的數字可以一次推好幾格。也可以在棋盤上滑動手指或用方向鍵。把數字依序排成 1、2、3…，空格留在右下角就完成了。</p></article><article><h2 data-en="Leaderboard">排行榜</h2><p data-en="Each size has its own leaderboard for solving time, measured by the server.">三種大小各有排行榜，比的是解題時間（伺服器計時）。</p></article></section>
<footer class="k-foot"><span data-en="Free to play. Scores you choose to submit appear on the global leaderboard.">免費遊玩；選擇上傳的成績會顯示在全球排行榜。</span>　<a href="privacy.html" data-en="Privacy policy">隱私權政策與廣告說明</a></footer>
